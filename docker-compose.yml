services:
  postgres_master:
    image: postgres:16.1-alpine3.18
    container_name: postgres_master
    environment:
      POSTGRES_DB: ${DB_NAME_MASTER}
      POSTGRES_USER: ${DB_USER_MASTER}
      POSTGRES_PASSWORD: ${DB_PASSWORD_MASTER}
      TZ: Europe/Moscow
    ports:
      - ${DB_PORT_MASTER}:5432
    volumes:
    #   - ./config/postgres/master/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
    #   - ./config/postgres/master/postgresql.conf:/var/lib/postgresql/data/postgresql.conf
      - ./pg_data/master/:/var/lib/postgresql/data
    networks:
      otus-network:
        ipv4_address: "172.33.0.3"
    env_file: ".env"
  redis:
    image: redis:alpine
    container_name: redis-container
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command:
      - '--appendonly'
      - 'yes'
      - '--save'
      - '60 10'
    environment:
      - REDIS_PASSWORD=123123vv
      - REDIS_LRU_LIMIT_MB=1024
  app:
    container_name: app_socnet
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    networks:
      otus-network:
        ipv4_address: "172.33.0.2"
    depends_on:
      - postgres_master
    env_file:
      - .env

networks:
  otus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.33.0.0/24
