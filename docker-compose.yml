services:
  postgres_master:
    image: citusdata/citus:latest
    container_name: postgres_master
    environment:
      POSTGRES_DB: ${DB_NAME_MASTER}
      POSTGRES_USER: ${DB_USER_MASTER}
      POSTGRES_PASSWORD: ${DB_PASSWORD_MASTER}
      PGPASSWORD: pass
      TZ: Europe/Moscow
    ports:
      - ${DB_PORT_MASTER}:5432
    volumes:
    #   - ./config/postgres/master/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
    #   - ./config/postgres/master/postgresql.conf:/var/lib/postgresql/data/postgresql.conf
      - ./pg_data/master/:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_preload_libraries=citus"]
    networks:
      otus-network:
        ipv4_address: "172.33.0.3"
    env_file: ".env"
  postgres_shard1:
    image: citusdata/citus:latest
    container_name: postgres_shard1
    environment:
      POSTGRES_DB: ${DB_NAME_SLAVE_1}
      POSTGRES_USER: ${DB_USER_SLAVE_1}
      POSTGRES_PASSWORD: ${DB_PASSWORD_SLAVE_1}
      PGPASSWORD: pass
      TZ: Europe/Moscow
    ports:
      - ${DB_PORT_SLAVE_1}:5432
    volumes:
    #   - ./config/postgres/master/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
    #   - ./config/postgres/master/postgresql.conf:/var/lib/postgresql/data/postgresql.conf
      - ./pg_data/shard1/:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_preload_libraries=citus"]
    networks:
      otus-network:
        ipv4_address: "172.33.0.12"
    env_file: ".env"
  postgres_shard2:
    image: citusdata/citus:latest
    container_name: postgres_shard2
    environment:
      POSTGRES_DB: ${DB_NAME_SLAVE_2}
      POSTGRES_USER: ${DB_USER_SLAVE_2}
      POSTGRES_PASSWORD: ${DB_PASSWORD_SLAVE_2}
      PGPASSWORD: pass
      TZ: Europe/Moscow
    ports:
      - ${DB_PORT_SLAVE_2}:5432
    volumes:
    #   - ./config/postgres/master/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
    #   - ./config/postgres/master/postgresql.conf:/var/lib/postgresql/data/postgresql.conf
      - ./pg_data/shard2/:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_preload_libraries=citus"]
    networks:
      otus-network:
        ipv4_address: "172.33.0.6"
    env_file: ".env"
  redis:
    image: redis:alpine
    container_name: redis-container
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    command:
      - '--appendonly'
      - 'yes'
      - '--save'
      - '60 10'
    environment:
      - REDIS_PASSWORD=123123vv
      - REDIS_LRU_LIMIT_MB=1024
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15674:15674"
    networks:
      otus-network:
        ipv4_address: "172.33.0.8"
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      #  Crucially, create a new user for production
      RABBITMQ_NODE_PORT: 5672
      RABBITMQ_NODE_NAME: mynode
      RABBITMQ_USER: myuser
      RABBITMQ_PASS: mystrongpassword
      RABBITMQ_USE_TLS: false
  app:
    container_name: app_socnet
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    networks:
      otus-network:
        ipv4_address: "172.33.0.2"
    depends_on:
      - postgres_master
    env_file:
      - .env

networks:
  otus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.33.0.0/24
